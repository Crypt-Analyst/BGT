name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django checks
      run: python manage.py check
      env:
        DJANGO_SECRET_KEY: test-key
        DJANGO_DEBUG: "False"
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    - name: Run migrations
      run: python manage.py migrate
      env:
        DJANGO_SECRET_KEY: test-key
        DJANGO_DEBUG: "False"
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    - name: Run tests
      run: python manage.py test --parallel
      env:
        DJANGO_SECRET_KEY: test-key
        DJANGO_DEBUG: "False"
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    - name: Run tests with coverage
      run: |
        pip install coverage
        coverage run --source='.' manage.py test
        coverage report
      env:
        DJANGO_SECRET_KEY: test-key
        DJANGO_DEBUG: "False"
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Run black
      run: black --check .

    - name: Run isort
      run: isort --check-only .

    - name: Run flake8
      run: flake8 . --max-line-length=120 --ignore=E203,W503 --exclude=.venv,migrations,__pycache__
