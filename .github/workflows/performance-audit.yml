name: Lighthouse performance audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: github-actions-test-secret
      DJANGO_DEBUG: "True"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g @lhci/cli
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run migrations
        run: python manage.py migrate
      - name: Start local Django server
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 >server.log 2>&1 &
          sleep 10
      - name: Run Lighthouse audit
        run: |
          npx @lhci/cli autorun --collect.url=http://127.0.0.1:8000 --upload.target=filesystem
